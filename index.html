<script>const projects = {"mpu6050": {"code": "#include <Wire.h>\n#include <MPU6050.h>\n\nMPU6050 mpu;\n\nvoid setup() {\n  Serial.begin(115200);\n  Wire.begin();  // ESP32: SDA=21, SCL=22\n  Serial.println(\"初始化MPU6050...\");\n  mpu.initialize();\n  if (mpu.testConnection()) {\n    Serial.println(\"MPU6050 连接成功\");\n  } else {\n    Serial.println(\"MPU6050 连接失败，请检查接线或I2C地址!\");\n    while (1) { delay(1000); }\n  }\n  mpu.setFullScaleGyroRange(MPU6050_GYRO_FS_2000);\n  mpu.setFullScaleAccelRange(MPU6050_ACCEL_FS_2);\n  Serial.println(\"MPU6050 初始化成功\");\n}\n\nvoid loop() {\n  int16_t ax, ay, az;\n  int16_t gx, gy, gz;\n  mpu.getMotion6(&ax, &ay, &az, &gx, &gy, &gz);\n  float accelX = ax / 16384.0;\n  float accelY = ay / 16384.0;\n  float accelZ = az / 16384.0;\n  float gyroX = gx / 16.4;\n  float gyroY = gy / 16.4;\n  float gyroZ = gz / 16.4;\n  Serial.printf(\"加速度 X:%.2f Y:%.2f Z:%.2f g\\n\", accelX, accelY, accelZ);\n  Serial.printf(\"陀螺仪 X:%.2f Y:%.2f Z:%.2f °/s\\n\", gyroX, gyroY, gyroZ);\n  Serial.println(\"---\");\n  delay(500);\n}\n", "diagram": "{\n  \"version\": 1,\n  \"author\": \"Sensor Lab\",\n  \"editor\": \"wokwi\",\n  \"parts\": [\n    {\n      \"type\": \"board-esp32-devkit-c-v4\",\n      \"id\": \"esp\",\n      \"top\": -57.6,\n      \"left\": -62.36,\n      \"attrs\": {}\n    },\n    {\n      \"type\": \"wokwi-mpu6050\",\n      \"id\": \"imu1\",\n      \"top\": 32.62,\n      \"left\": 127.12,\n      \"attrs\": {}\n    }\n  ],\n  \"connections\": [\n    [\n      \"esp:TX\",\n      \"$serialMonitor:RX\",\n      \"\",\n      []\n    ],\n    [\n      \"esp:RX\",\n      \"$serialMonitor:TX\",\n      \"\",\n      []\n    ],\n    [\n      \"imu1:VCC\",\n      \"esp:3V3\",\n      \"red\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"imu1:GND\",\n      \"esp:GND.2\",\n      \"black\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"imu1:SCL\",\n      \"esp:22\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"imu1:SDA\",\n      \"esp:21\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n    ]\n  ],\n  \"dependencies\": {}\n}\n", "libraries": "MPU6050\n"}, "fsr402": {"code": "// 实物：3V3 → FSR402 → GPIO34 → 10kΩ → GND。\n// Wokwi：电位器 SIG 接 GPIO34，代替变化的模拟输入。\nconst int FSR_PIN = 34;\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(FSR_PIN, INPUT);\n  Serial.println(\"FSR402压力传感器测试开始\");\n}\n\nvoid loop() {\n  int rawValue = analogRead(FSR_PIN);\n  float voltage = rawValue * (3.3 / 4095.0);\n  Serial.printf(\"ADC值: %d | 电压: %.2fV | 压力: \", rawValue, voltage);\n  if (rawValue < 100) Serial.println(\"无压力\");\n  else if (rawValue < 500) Serial.println(\"轻压\");\n  else if (rawValue < 800) Serial.println(\"中压\");\n  else Serial.println(\"重压\");\n  delay(200);\n}\n", "diagram": "{\n  \"version\": 1,\n  \"author\": \"Sensor Lab\",\n  \"editor\": \"wokwi\",\n  \"parts\": [\n    {\n      \"type\": \"board-esp32-devkit-c-v4\",\n      \"id\": \"esp\",\n      \"top\": -19.2,\n      \"left\": -302.36,\n      \"attrs\": {}\n    },\n    {\n      \"type\": \"wokwi-potentiometer\",\n      \"id\": \"pot1\",\n      \"top\": -39.7,\n      \"left\": -9.8,\n      \"attrs\": {}\n    }\n  ],\n  \"connections\": [\n    [\n      \"esp:TX\",\n      \"$serialMonitor:RX\",\n      \"\",\n      []\n    ],\n    [\n      \"esp:RX\",\n      \"$serialMonitor:TX\",\n      \"\",\n      []\n    ],\n    [\n      \"pot1:VCC\",\n      \"esp:3V3\",\n      \"red\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"pot1:GND\",\n      \"esp:GND.2\",\n      \"black\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"pot1:SIG\",\n      \"esp:34\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n    ]\n  ],\n  \"dependencies\": {}\n}\n", "libraries": ""}, "hx711": {"code": "#include <HX711.h>\n\nHX711 scale;\nconst int DT_PIN = 32;\nconst int SCK_PIN = 33;\n// 教程的 2280 是示例系数；Wokwi 5kg 模型使用 420 原始值/kg。\n// 使用实物时需要按已知砝码重新标定。\nconst float CALIBRATION_FACTOR = 420.0;\n\nvoid setup() {\n  Seria talWrite(TRIG_PIN, LOW);\n  unsigned long duration = pulseIn(ECHO_PIN, HIGH, 30000);\n  if (duration == 0) {\n    Serial.println(\"HC-SR04 无回波\");\n  } else {\n    long distance = duration * 0.034 / 2;\n    Serial.printf(\"距离: %ld cm\", distance);\n    if (distance < 5) Serial.println(\" - 非常近!\");\n    else if (distance < 20) Serial.println(\" - 近距离\");\n    else if (distance < 100) Serial.println(\" - 中距离\");\n    else if (distance < 400) Serial.println(\" - 远距离\");\n    else Serial.println(\" - 超出测量范围\");\n  }\n  delay(500);\n}\n", "diagram": "{\n  \"version\": 1,\n  \"author\": \"Sensor Lab\",\n  \"editor\": \"wokwi\",\n  \"parts\": [\n    {\n      \"type\": \"board-esp32-devkit-c-v4\",\n      \"id\": \"esp\",\n      \"top\": 0,\n      \"left\": -139.16,\n      \"attrs\": {}\n    },\n    {\n      \"type\": \"wokwi-hc-sr04\",\n      \"id\": \"ultrasonic1\",\n      \"top\": 30.3,\n      \"left\": 139.9,\n      \"attrs\": {\n        \"distance\": \"100\"\n      }\n    }\n  ],\n  \"connections\": [\n    [\n      \"esp:TX\",\n      \"$serialMonitor:RX\",\n      \"\",\n      []\n    ],\n    [\n      \"esp:RX\",\n      \"$serialMonitor:TX\",\n      \"\",\n      []\n    ],\n    [\n      \"ultrasonic1:VCC\",\n      \"esp:5V\",\n      \"red\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"ultrasonic1:GND\",\n      \"esp:GND.2\",\n      \"black\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"ultrasonic1:TRIG\",\n      \"esp:26\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"ultrasonic1:ECHO\",\n      \"esp:27\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n    ]\n  ],\n  \"dependencies\": {}\n}\n", "libraries": ""}, "combined": {"code": "// 参考飞书多传感器实验，仅保留四种传感器的数据采集。\n#include <Wire.h>\n#include <MPU6050.h>\n#include <HX711.h>\n\nMPU6050 mpu;\nHX711 scale;\nconst int FSR_PIN = 34;\nconst int TRIG_PIN = 26;\nconst int ECHO_PIN = 27;\nconst int DT_PIN = 32;\nconst int SCK_PIN = 33;\n// Wokwi 5kg 称重模型为 420 原始值/kg。实物需自行标定。\nconst float CALIBRATION_FACTOR = 420.0;\n\nvoid setup() {\n  Serial.begin(115200);\n  Wire.begin();\n  mpu.initialize();\n  if (!mpu.testConnection()) {\n    Serial.println(\"MPU6050 连接失败，请检查接线\");\n    while (1) { delay(1000); }\n  }\n  mpu.setFullScaleGyroRange(MPU6050_GYRO_FS_2000);\n  mpu.setFullScaleAccelRange(MPU6050_ACCEL_FS_2);\n  pinMode(FSR_PIN, INPUT);\n  scale.begin(DT_PIN, SCK_PIN);\n  scale.set_scale(CALIBRATION_FACTOR);\n  if (scale.wait_ready_timeout(2000)) {\n    scale.tare();  // 开始时保持空载\n    Serial.println(\"HX711 去皮完成\");\n  } else {\n    Serial.println(\"HX711 未就绪，请检查接线\");\n  }\n  pinMode(TRIG_PIN, OUTPUT);\n  pinMode(ECHO_PIN, INPUT);\n  digitalWrite(TRIG_PIN, LOW);\n  Serial.println(\"所有传感器初始化完成\");\n}\n\nvoid loop() {\n  int16_t ax, ay, az, gx, gy, gz;\n  mpu.getMotion6(&ax, &ay, &az, &gx, &gy, &gz);\n  Serial.printf(\"加速度 X:%.2fg Y:%.2fg Z:%.2fg | \", ax/16384.0, ay/16384.0, az/16384.0);\n  Serial.printf(\"陀螺仪 X:%.2f°/s Y:%.2f°/s Z:%.2f°/s\\n\", gx/16.4, gy/16.4, gz/16.4);\n\n  int rawValue = analogRead(FSR_PIN);\n  float voltage = rawValue * (3.3 / 4095.0);\n  Serial.printf(\"FSR ADC值: %d | 电压: %.2fV | 压力: \", rawValue, voltage);\n  if (rawValue < 100) Serial.println(\"无压力\");\n  else if (rawValue < 500) Serial.println(\"轻压\");\n  else if (rawValue < 800) Serial.println(\"中压\");\n  else Serial.println(\"重压\");\n\n  if (scale.is_ready()) {\n    Serial.printf(\"重量: %.2f kg\\n\", scale.get_units(5));\n  } else {\n    Serial.println(\"HX711 未就绪，请检查接线\");\n  }\n\n  digitalWrite(TRIG_PIN, LOW);\n  delayMicroseconds(2);\n  digitalWrite(TRIG_PIN, HIGH);\n  delayMicroseconds(10);\n  digitalWrite(TRIG_PIN, LOW);\n  unsigned long duration = pulseIn(ECHO_PIN, HIGH, 30000);\n  if (duration == 0) {\n    Serial.println(\"HC-SR04 无回波\");\n  } else {\n    long distance = duration * 0.034 / 2;\n    Serial.printf(\"距离: %ld cm\", distance);\n    if (distance < 10) Serial.println(\" - 很近!\");\n    else if (distance < 50) Serial.println(\" - 近距离\");\n    else if (distance < 200) Serial.println(\" - 中距离\");\n    else Serial.println(\" - 远距离\");\n  }\n  Serial.println(\"----------\");\n  delay(500);\n}\n", "diagram": "{\n  \"version\": 1,\n  \"author\": \"Sensor Lab\",\n  \"editor\": \"wokwi\",\n  \"parts\": [\n    {\n      \"type\": \"board-esp32-devkit-c-v4\",\n      \"id\": \"esp\",\n      \"top\": 0,\n      \"left\": 0,\n      \"attrs\": {}\n    },\n    {\n      \"type\": \"wokwi-mpu6050\",\n      \"id\": \"imu1\",\n      \"top\": 0,\n      \"left\": 260,\n      \"attrs\": {}\n    },\n    {\n      \"type\": \"wokwi-potentiometer\",\n      \"id\": \"pot1\",\n      \"top\": 110,\n      \"left\": 260,\n      \"attrs\": {}\n    },\n    {\n      \"type\": \"wokwi-hx711\",\n      \"id\": \"scale1\",\n      \"top\": 220,\n      \"left\": 260,\n      \"attrs\": {\n        \"type\": \"5kg\"\n      }\n    },\n    {\n      \"type\": \"wokwi-hc-sr04\",\n      \"id\": \"ultrasonic1\",\n      \"top\": 330,\n      \"left\": 260,\n      \"attrs\": {\n        \"distance\": \"100\"\n      }\n    }\n  ],\n  \"connections\": [\n    [\n      \"esp:TX\",\n      \"$serialMonitor:RX\",\n      \"\",\n      []\n    ],\n    [\n      \"esp:RX\",\n      \"$serialMonitor:TX\",\n      \"\",\n      []\n    ],\n    [\n      \"imu1:VCC\",\n      \"esp:3V3\",\n      \"red\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"imu1:GND\",\n      \"esp:GND.2\",\n      \"black\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"imu1:SCL\",\n      \"esp:22\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"imu1:SDA\",\n      \"esp:21\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"pot1:VCC\",\n      \"esp:3V3\",\n      \"red\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"pot1:GND\",\n      \"esp:GND.2\",\n      \"black\",\n      [\n        \"v0\"\n      ]\n    ],\n    [\n      \"pot1:SIG\",\n      \"esp:34\",\n      \"green\",\n      [\n        \"v0\"\n      ]\n // Parameters demonstrate readings; this module does not execute Arduino code.
const defaults = {
  mpu6050: {ax:0, ay:0, az:1, gx:0, gy:0, gz:0},
  fsr402: {adc:0}, hx711: {load:0}, hcsr04: {distance:100, echo:true},
  combined: {ax:0, ay:0, az:1, gx:0, gy:0, gz:0, adc:0, load:0, distance:100, echo:true}
};
function measure(id, input, context = {}) {
  if (id === 'combined') {
    const mpu = measure('mpu6050',input), fsr = measure('fsr402',input);
    const hx = measure('hx711',input,context), hc = measure('hcsr04',input,{combined:true});
    const values = mpu.values;
    return {mpu,fsr,hx,hc,lines:[
      `加速度 X:${values[0].toFixed(2)}g Y:${values[1].toFixed(2)}g Z:${values[2].toFixed(2)}g | 陀螺仪 X:${values[3].toFixed(2)}°/s Y:${values[4].toFixed(2)}°/s Z:${values[5].toFixed(2)}°/s`,
      'FSR ' + fsr.lines[0], ...hx.lines, ...hc.lines, '----------']};
  }
  if (id === 'mpu6050') {
    const raw = ['ax','ay','az','gx','gy','gz'].map((key, i) =>
      Math.max(-32768, Math.min(32767, Math.round(input[key] * (i < 3 ? 16384 : 16.4)))));
    const values = raw.map((value, i) => value / (i < 3 ? 16384 : 16.4));
    return {raw, values, lines:[
      `加速度 X:${values[0].toFixed(2)} Y:${values[1].toFixed(2)} Z:${values[2].toFixed(2)} g`,
      `陀螺仪 X:${values[3].toFixed(2)} Y:${values[4].toFixed(2)} Z:${values[5].toFixed(2)} °/s`, '---']};
  }
  if (id === 'fsr402') {
    const adc = Math.max(0,Math.min(4095,Math.round(input.adc)));
    const voltage = adc * (3.3 / 4095);
    const pressure = adc < 100 ? '无压力' : adc < 500 ? '轻压' : adc < 800 ? '中压' : '重压';
    return {adc, voltage, pressure, lines:[`ADC值: ${adc} | 电压: ${voltage.toFixed(2)}V | 压力: ${pressure}`]};
  }
  if (id === 'hx711') {
    // Wokwi 5kg model: 0–5kg corresponds to raw readings 0–2100.
    const raw = Math.round(input.load * 420);
    const weight = (raw - (context.tareRaw || 0)) / 420;
    return {raw, weight, lines:[`重量: ${weight.toFixed(2)} kg`]};
  }
  if (id === 'hcsr04') {
    // Ideal 340m/s echo timing. The reference sketch truncates distance to cm.
    const pulse = input.echo ? Math.ceil(input.distance / .017) : 0;
    const distance = pulse ? Math.trunc(pulse * .034 / 2) : null;
    const label = distance === null ? '无回波' : context.combined
      ? distance < 10 ? '很近!' : distance < 50 ? '近距离' : distance < 200 ? '中距离' : '远距离'
      : distance < 5 ? '非常近!' : distance < 20 ? '近距离' : distance < 100 ? '中距离' : distance < 400 ? '远距离' : '超出测量范围';
    return {pulse, distance, label, lines:[pulse ? `距离: ${distance} cm - ${label}` : 'HC-SR04 无回波']};
  }
  throw new Error('Unknown experiment: ' + id);
}

    note:'按教程显示整数距离及远近提示；勾选“无回波”观察超时。超过400 cm的输入仅用于现象示意。',
    wiring:[['VCC','5V'],['GND','GND'],['TRIG','GPIO26'],['ECHO','GPIO27（实物需分压）']],
    wiringNote:'Wokwi 可直接接 ECHO，距离范围2–400 cm。实物 ECHO 用分压接 ESP32：ECHO→1kΩ→GPIO27→2kΩ→GND。',
    sourceNote:'距离 = 回波时间 × 0.034 / 2，取整数；增加30 ms无回波超时，避免等待卡住。网页采用理想340m/s模型。',
    url:'https://wcn5nr4htkrb.feishu.cn/wiki/GmPlwxo1wij48KkD7TccVQhhnNb',
    interval:500,
    controls:[['distance','目标距离',2,450,1,'cm']],
    presets:[['非常近',{distance:3,echo:true}],['近距离',{distance:10,echo:true}],['中距离',{distance:50,echo:true}],['远距离',{distance:200,echo:true}],['超出范围',{distance:450,echo:true}]]}
};
specs.combined = {
  name:'综合采集',title:'ESP32 多传感器综合采集',description:'同时读取 MPU6050、FSR402、HX711 和 HC-SR04。',
  note:'先空载开始，再改变压力、负载、距离或运动输入。四种数据在同一轮串口输出。',
  wiring:[['MPU6050 VCC / GND','3V3 / GND'],['MPU6050 SDA / SCL','GPIO21 / GPIO22'],['电位器 VCC / GND / SIG','3V3 / GND / GPIO34'],['HX711 VCC / GND / DT / SCK','5V / GND / GPIO32 / GPIO33'],['HC-SR04 VCC / GND / TRIG / ECHO','5V / GND / GPIO26 / GPIO27']],
  wiringNote:'所有传感器共地。实物超声波 ECHO 需分压，HX711 数字逻辑需与 ESP32 的3.3V兼容。',
  sourceNote:'参考后两份文档的采集函数；依赖 MPU6050 和 HX711。综合距离提示按10、50、200 cm分档。',
  references:[['多传感器采集','https://wcn5nr4htkrb.feishu.cn/wiki/OW9fwyuZliZkxBkVasNcvsFhneG'],['系统中的采集函数','https://wcn5nr4htkrb.feishu.cn/wiki/Ps12whZ9iiQ6OikyvRAckM5inXb']],
  interval:500,
  controls:[...specs.mpu6050.controls,...specs.fsr402.controls,...specs.hx711.controls,...specs.hcsr04.controls],
  presets:[['静止 / 空载',{...defaults.combined}],['按压 + 放上1 kg',{adc:650,load:1}],['目标靠近',{distance:5,echo:true}]]
};
let active = 'mpu6050', state = {...defaults[active]}, timer = null, last = null, lines = [], initialized = false, tareRaw = 0, elapsedMs = 0;

function stop() {
  if (timer !== null) clearInterval(timer);
  timer = null;
  $('run').textContent = '开始实验';
  $('status').textContent = last ? '已停止' : '未开始';
}
function showSource() {
  const file = $('file-select').value;
  $('source').textContent = projects[active][file] || '无需额外依赖库。';
}
function buildControls() {
  const spec = specs[active];
  $('controls').replaceChildren();
  for (const [key,label,min,max,step,unit] of spec.controls) {
    const wrapper = document.createElement('label');
    wrapper.className = 'control' + (spec.controls.length === 1 ? ' full' : '');
    wrapper.innerHTML = `<span class="control-heading"><span>${label}<\/span><output id="value-${key}"><\/output><\/span><input type="range" id="input-${key}" aria-label="${label}" min="${min}" max="${max}" step="${step}"><span class="ends"><span>${min} ${unit}<\/span><span>${max} ${unit}<\/span><\/span>`;
    wrapper.querySelector('input').addEventListener('input', event => {
      state[key] = Number(event.target.value); updateInputs();
    });
    $('controls').append(wrapper);
  }
  if (active === 'hcsr04' || active === 'combined') {
    const wrapper = document.createElement('label');
    wrapper.className = 'check full';
    wrapper.innerHTML = '<input id="no-echo" type="checkbox">无回波';
    wrapper.querySelector('input').addEventListener('change', event => {state.echo = !event.target.checked; updateInputs();});
    $('controls').append(wrapper);
  }
  $('presets').replaceChildren();
  for (const [label,values] of spec.presets) {
    const button = document.createElement('button');
    button.textContent = label;
    button.addEventListener('click', () => {Object.assign(state,values); updateInputs();});
    $('presets').append(button);
  }
  updateInputs();
}
function updateInputs() {
  for (const [key,, , ,step,unit] of specs[active].controls) {
    $('input-' + key).value = state[key];
    $('value-' + key).textContent = state[key].toFixed(step < 1 ? 2 : 0) + ' ' + unit;
  }
  if (active === 'hcsr04' || active === 'combined') {$('no-echo').checked = !state.echo; $('input-distance').disabled = !state.echo;}
  drawVisual();
}
function drawVisual() {
  const diagram = JSON.parse(projects[active].diagram);
  const parts = diagram.parts.filter(part => part.id !== 'esp');
  const pinY = new Map(), endpoints = new Map();
  const links = diagram.connections.filter(wire => !wire[1].startsWith('$'));
  const boardPins = [...new Set(links.map(wire => wire[1].split(':')[1]))];
  let drawing = '<rect x="145" y="80" width="190" height="390" rx="8" fill="#27312b" stroke="#1c281e" stroke-width="3"/><rect x="155" y="93" width="115" height="90" rx="3" fill="#bdc5b7" stroke="#81907c"/><path d="M164 100h85v9h-75v10h75v9h-75v10h75" fill="none" stroke="#73816e" stroke-width="3"/><text x="162" y="165" fill="#52634e" font-size="11">ESP-WROOM-32<\/text><rect x="174" y="216" width="60" height="63" rx="3" fill="#101a13" stroke="#697565"/><text x="203" y="253" fill="#c7d6bc" text-anchor="middle" font-size="12">ESP32<\/text><rect x="207" y="427" width="42" height="43" rx="4" fill="#b2bca9" stroke="#798570"/><rect x="215" y="442" width="26" height="16" fill="#4d5a48"/><text x="205" y="496" fill="#70876c" text-anchor="middle" font-size="13">ESP32 DevKitC<\/text>';
  for (let i=0;i<12;i++) drawing += `<rect x="134" y="${99+i*27}" width="13" height="8" class="visual-pin"/>`;
  boardPins.forEach((pin,i) => {
    const y = 128 + i*28; pinY.set(pin,y);
    drawing += `<text x="317" y="${y+4}" fill="#cbd6c0" text-anchor="end" font-size="11">${/^\d+$/.test(pin) ? 'GPIO'+pin : pin.replace('GND.2','GND')}<\/text><rect x="330" y="${y-4}" width="14" height="8" class="visual-pin"/>`;
  });
  const styles = {
    'wokwi-mpu6050':['MPU6050',['VCC','GND','SCL','SDA'],'#5e886c'],
    'wokwi-potentiometer':['电位器 · FSR402 输入',['VCC','GND','SIG'],'#667852'],
    'wokwi-hx711':['HX711',['VCC','GND','DT','SCK'],'#6d8b67'],
    'wokwi-hc-sr04':['HC-SR04',['VCC','GND','TRIG','ECHO'],'#51888e']
  };
  parts.forEach((part,index) => {
    const y = parts.length === 1 ? 214 : 50+index*120;
    const [name,pins,color] = styles[part.type];
    drawing += `<text x="662" y="${y-10}" fill="#6f866d" text-anchor="middle" font-size="13">${name}<\/text><rect x="552" y="${y}" width="220" height="95" rx="5" fill="${color}" stroke="#4d6650"/>`;
    pins.forEach((pin,i) => {
      const py = y+16+i*19; endpoints.set(part.id+':'+pin,{x:547,y:py,index,pinIndex:i});
      drawing += `<rect x="546" y="${py-3}" width="10" height="6" class="visual-pin"/><text x="563" y="${py+4}" fill="#e0ead6" font-size="10">${pin}<\/text>`;
    });
    if (part.type === 'wokwi-mpu6050') {
      const angle = Math.atan2(state.ax,state.az)*180/Math.PI;
      drawing += `<rect x="674" y="${y+24}" width="41" height="36" fill="#202e24"/><path d="M737 ${y+40}v-22m0 22h22" stroke="#d5e6c5" stroke-width="2"/><g transform="translate(694 ${y+42}) rotate(${angle})"><path d="M0 -13v26m-5-20 5-6 5 6" stroke="#a4e8bb" fill="none" stroke-width="2"/><\/g><text x="659" y="${y+83}" fill="#e3ecdb" font-size="10">Z ${state.az.toFixed(2)} g · ${state.gz} °/s<\/text>`;
    } else if (part.type === 'wokwi-potentiometer') {
      drawing += `<circle cx="700" cy="${y+43}" r="27" fill="#bbc6ac" stroke="#3c4935" stroke-width="4"/><g transform="translate(700 ${y+43}) rotate(${state.adc/4095*270-135})"><path d="M0 0v-20" stroke="#3d5136" stroke-width="4"/><\/g><text x="660" y="${y+83}" fill="#e3ecdb" font-size="11">ADC ${state.adc}<\/text>`;
    } else if (part.type === 'wokwi-hx711') {
      drawing += `<rect x="653" y="${y+50}" width="100" height="13" rx="3" fill="#ccd7c1"/><path d="M669 ${y+45}h70" stroke="#e5ecdf" stroke-width="4"/>${state.load>0 ? `<rect x="686" y="${y+15}" width="37" height="28" rx="4" fill="#a4e8bb"/>` : ''}<text x="659" y="${y+83}" fill="#e3ecdb" font-size="11">负载 ${state.load.toFixed(2)} kg<\/text>`;
    } else {
      drawing += `<circle cx="684" cy="${y+43}" r="23" fill="#c8d0c3" stroke="#354e4f" stroke-width="3"/><circle cx="741" cy="${y+43}" r="23" fill="#c8d0c3" stroke="#354e4f" stroke-width="3"/><circle cx="684" cy="${y+43}" r="16" fill="#8b9b91"/><circle cx="741" cy="${y+43}" r="16" fill="#8b9b91"/><text x="659" y="${y+83}" fill="#e3ecdb" font-size="11">${state.echo ? '目标 '+state.distance+' cm' : '无回波'}<\/text>`;
    }
  });
  let wires = '';
  for (const [from,to,color] of links) {
    const endpoint = endpoints.get(from), sourceY = pinY.get(to.split(':')[1]);
    if (!endpoint || sourceY === undefined) continue;
    const bend = 387+endpoint.index*24+endpoint.pinIndex*8;
    const stroke = color === 'red' ? '#bd6f69' : color === 'black' ? '#77857d' : '#65a377';
    wires += `<path class="connection" d="M344 ${sourceY}H${bend}V${endpoint.y}H${endpoint.x}" stroke="${stroke}"/>`;
  }
  $('visual').innerHTML = `<svg viewBox="0 0 900 550" aria-hidden="true">${wires}${drawing}<\/svg>`;
  $('visual').setAttribute('aria-label',`ESP32 与 ${specs[active].name} 的固定接线示意`);
}
function cardsFor(id, result) {
  let cards;
  if (id === 'mpu6050') {
    cards = ['X','Y','Z'].map((axis,i) => [axis+' 轴加速度',result ? result.values[i].toFixed(2) : '--','g']);
    cards.push(...['X','Y','Z'].map((axis,i) => [axis+' 轴角速度',result ? result.values[i+3].toFixed(2) : '--','°/s']));
  } else if (id === 'fsr402') {
    cards = [['ADC 原始值',result ? result.adc : '--','0–4095'],['分压电压',result ? result.voltage.toFixed(2) : '--','V · 按ADC换算'],['压力等级',result ? result.pressure : '--','教程示意阈值']];
  } else if (id === 'hx711') {
    cards = [['相对重量',result ? result.weight.toFixed(2) : '--','kg · 去皮后'],['HX711 原始值',result ? result.raw : '--','Wokwi 5 kg 模型']];
  } else {
    cards = [['测得距离',result ? (result.distance === null ? '无回波' : result.distance) : '--','cm'],['回波时间',result ? result.pulse : '--','µs'],['距离提示',result ? result.label : '--','按教程分档']];
  }
  return cards;
}
function showReadings() {
  const cards = active === 'combined'
    ? [
      ['MPU6050 · 加速度 XYZ',last ? last.mpu.values.slice(0,3).map(v=>v.toFixed(2)).join(' / ') : '--',last ? 'g · 角速度 '+last.mpu.values.slice(3).map(v=>v.toFixed(2)).join(' / ')+' °/s' : 'g / °/s'],
      ['FSR402 · 压力',last ? last.fsr.pressure : '--',last ? `ADC ${last.fsr.adc} · ${last.fsr.voltage.toFixed(2)} V` : 'ADC / 电压'],
      ['HX711 · 相对重量',last ? last.hx.weight.toFixed(2) : '--','kg · 去皮后'],
      ['HC-SR04 · 距离',last ? (last.hc.distance === null ? '无回波' : last.hc.distance) : '--',last ? 'cm · '+last.hc.label : 'cm']
    ]
    : cardsFor(active,last);
  $('readings').innerHTML = cards.map(([label,value,unit],i) => `<div class="reading" style="--color:${['#d09756','#54866b','#70a8b8','#aa79a2'][i%4]}"><div class="reading-header"><i><\/i>${label}<\/div><strong class="${isNaN(Number(value)) ? 'text-value' : ''}">${value}<\/strong><small>${unit}<\/small><\/div>`).join('');
}
function log(newLines) {
  lines.push(...newLines);
  lines = lines.slice(-120);
  $('console').textContent = lines.join('\n');
  $('console').scrollTop = $('console').scrollHeight;
}
function sample() {
  last = measure(active,state,{tareRaw}); showReadings(); log(last.lines);
  $('elapsed').textContent = `${String(Math.floor(elapsedMs/60000)).padStart(2,'0')}:${String(Math.floor(elapsedMs/1000)%60).padStart(2,'0')}.${String(elapsedMs%1000).padStart(3,'0')}`;
}
function selectExperiment(id) {
  stop(); active = id; state = {...defaults[id]}; last = null; lines = [];
  initialized = false; tareRaw = 0; elapsedMs = 0; $('elapsed').textContent = '00:00.000';
  const spec = specs[id];
  for (const button of document.querySelectorAll('[data-experiment]')) button.setAttribute('aria-pressed',String(button.dataset.experiment === id));
  $('title').textContent = spec.title; $('description').textContent = spec.description;
  $('input-note').textContent = spec.note; $('wiring-note').textContent = spec.wiringNote;
  $('wiring').innerHTML = spec.wiring.map(([pin,target]) => `<tr><td>${pin}<\/td><td>${target}<\/td><\/tr>`).join('');
  $('source-note').replaceChildren(document.createTextNode(spec.sourceNote + ' '));
  for (const [label,url] of spec.references || [['参考资料',spec.url]]) {
    const link = document.createElement('a'); link.href = url; link.textContent = label; link.target = '_blank'; link.rel = 'noopener'; $('source-note').append(link,document.createTextNode(' '));
  }
  $('sampling-note').textContent = `每 ${spec.interval} ms 读取一次`;
  $('file-select').value = 'code'; showSource(); buildControls(); showReadings();
  $('status').textContent = '未开始'; $('console').textContent = '点击「开始实验」读取数据。';
}
document.querySelectorAll('[data-experiment]').forEach(button => button.addEventListener('click', () => selectExperiment(button.dataset.experiment)));
$('run').addEventListener('click', () => {
  if (timer !== null) {stop(); return;}
  $('status').textContent = '读取中'; $('run').textContent = '停止实验';
  if (!initialized) {
    if (active === 'hx711' || active === 'combined') {
      tareRaw = Math.round(state.load * 420);
      log(['HX711 去皮完成']);
    }
    log(active === 'mpu6050' ? ['初始化MPU6050...','MPU6050 连接成功','MPU6050 初始化成功']
      : active === 'fsr402' ? ['FSR402压力传感器测试开始']
      : active === 'hcsr04' ? ['HC-SR04超声波传感器测试'] : [specs[active].name + ' 初始化成功']);
    initialized = true;
  }
  sample(); timer = setInterval(() => {elapsedMs += specs[active].interval; sample();},specs[active].interval);
});
$('reset').addEventListener('click', () => selectExperiment(active));
$('clear').addEventListener('click', () => {lines = []; $('console').textContent = '';});
$('file-select').addEventListener('change',showSource);
$('download').addEventListener('click', () => {
  const file = $('file-select').value;
  const names = {code:'sketch.ino',diagram:'diagram.json',libraries:'libraries.txt'};
  const url = URL.createObjectURL(new Blob([projects[active][file]],{type:'text/plain;charset=utf-8'}));
  const link = document.createElement('a'); link.href = url; link.download = names[file]; link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
});
selectExperiment(active);
</script></body></html>
