name: Publish sensor experiments

on:
  push:
    branches: [main]
    paths:
      - index.html
      - clock.html
      - sensor-experiments.zip
      - .github/workflows/clock.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package static website
        run: |
          mkdir -p dist
          cp index.html clock.html sensor-experiments.zip dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy experiment page
        id: deployment
        uses: actions/deploy-pages@v4
  
